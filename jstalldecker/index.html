<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rolo — Petromark SRL</title>
<meta name="description" content="Contacto de Rolo, Petromark SRL. Servicios de integridad de ductos, protección catódica, monitoreo de corrosión, pigging e inspección.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="../img/escudo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --celeste: #00a8d4;
    --celeste-oscuro: #0089ad;
    --negro: #141210;
    --plata: #bdbbbe;
    --gris-claro: #eaeaeb;
    --gris-texto: #6b6b6e;
    --fondo: #f3f3f4;
    --blanco: #ffffff;
    --borde: #d9d8da;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    background: var(--fondo);
    color: var(--negro);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .tarjeta {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--fondo);
  }
  @media (min-width: 480px) {
    body { align-items: center; padding: 24px 0; }
    .tarjeta {
      min-height: 0;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(20, 18, 16, 0.15);
    }
  }

  header {
    background: var(--blanco);
    border-bottom: 4px solid var(--celeste);
    padding: 26px 24px 22px;
    padding-top: calc(26px + env(safe-area-inset-top, 0px));
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .marca { display: flex; align-items: center; justify-content: space-between; }
  .marca img { width: 150px; height: auto; display: block; }
  .nfc { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--gris-texto); letter-spacing: 0.06em; text-transform: uppercase; }
  .nfc svg { width: 16px; height: 16px; stroke: var(--celeste); }

  .persona { display: flex; align-items: center; gap: 16px; }
  .foto {
    width: 84px; height: 84px; flex: none;
    border-radius: 12px;
    background: var(--gris-claro);
    border: 1px solid var(--plata);
    object-fit: cover;
  }
  .datos { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .nombre {
    font-family: 'Anton', 'Arial Narrow', sans-serif;
    font-size: 30px; line-height: 1.05; letter-spacing: 0.01em;
    text-transform: uppercase; margin: 0;
  }
  .cargo { font-size: 14px; font-weight: 600; color: var(--celeste-oscuro); }
  .empresa { font-size: 13px; color: var(--gris-texto); }

  main { padding: 20px 24px 0; display: flex; flex-direction: column; gap: 22px; }
  .acciones { display: flex; flex-direction: column; gap: 10px; }
  .accion {
    display: flex; align-items: center; gap: 14px;
    min-height: 52px; padding: 0 16px;
    border-radius: 10px;
    background: var(--blanco);
    border: 1px solid var(--borde);
    font-size: 15px; font-weight: 500;
    color: var(--negro); text-decoration: none;
  }
  .accion:active { background: var(--gris-claro); }
  .accion:focus-visible { outline: 2px solid var(--celeste); outline-offset: 2px; }
  .accion svg { width: 20px; height: 20px; flex: none; stroke: var(--celeste); }
  .accion .label { flex: 1; }
  .accion .detalle { font-size: 13px; color: var(--gris-texto); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 55%; }

  .servicios h2 { font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gris-texto); margin: 0 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .chips li {
    padding: 7px 12px; border-radius: 999px;
    background: var(--blanco); border: 1px solid var(--plata);
    font-size: 12.5px;
  }

  .sello { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 0; }
  .sello img { width: 92px; height: auto; opacity: 0.9; }

  footer { padding: 0 24px 28px; padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
  .guardar {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 54px; border-radius: 10px;
    background: var(--negro); color: var(--blanco);
    font: inherit; font-weight: 600; font-size: 16px;
    border: 0; cursor: pointer; width: 100%;
  }
  .guardar svg { width: 20px; height: 20px; stroke: var(--celeste); }
  .guardar:focus-visible { outline: 2px solid var(--celeste); outline-offset: 2px; }
  .nota { text-align: center; font-size: 11.5px; color: var(--gris-texto); margin: 0; }

  @media (prefers-reduced-motion: no-preference) {
    .accion, .guardar { transition: background-color 120ms ease; }
  }
</style>
</head>
<body>
<div class="tarjeta">

  <header>
    <div class="marca">
      <img src="../img/wordmark.png" alt="Petromark">
      <span class="nfc" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.5a8 8 0 0 1 12 0"/><path d="M8.5 11.5a4.5 4.5 0 0 1 7 0"/><circle cx="12" cy="15" r="1"/></svg>
        Tarjeta NFC
      </span>
    </div>
    <div class="persona">
      <img class="foto" src="foto.jpg" alt="" onerror="this.style.visibility='hidden'">
      <div class="datos">
        <h1 class="nombre" data-campo="nombre">Nombre Apellido</h1>
        <div class="cargo" data-campo="cargo">Cargo</div>
        <div class="empresa">Petromark SRL · Neuquén, Argentina</div>
      </div>
    </div>
  </header>

  <main>
    <div class="acciones">
      <a class="accion" id="btn-tel" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.7a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7A2 2 0 0 1 22 16.9z"/></svg>
        <span class="label">Llamar</span>
        <span class="detalle" data-campo="telefonoVisible"></span>
      </a>
      <a class="accion" id="btn-wa" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.6 7.3L3 21l2.2-5.4A8.5 8.5 0 1 1 21 11.5z"/></svg>
        <span class="label">WhatsApp</span>
        <span class="detalle">Escribir</span>
      </a>
      <a class="accion" id="btn-mail" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <span class="label">Email</span>
        <span class="detalle" data-campo="email"></span>
      </a>
      <a class="accion" id="btn-web" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        <span class="label">Sitio web</span>
        <span class="detalle" data-campo="webVisible"></span>
      </a>
    </div>

    <section class="servicios">
      <h2>Servicios</h2>
      <ul class="chips">
        <li>Integridad de ductos</li>
        <li>Protección catódica</li>
        <li>Monitoreo de corrosión</li>
        <li>Pigging</li>
        <li>Inspección</li>
      </ul>
    </section>
  </main>

  <div class="sello" aria-hidden="true">
    <img src="../img/escudo.png" alt="">
  </div>

  <footer>
    <button class="guardar" id="btn-vcf" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
      Guardar contacto
    </button>
    <p class="nota">Descarga la ficha de contacto (.vcf) a tu agenda</p>
  </footer>

</div>

<script>
  // ==========================================================
  //  DATOS DE LA PERSONA — lo único que se edita por tarjeta
  // ==========================================================
  const persona = {
    nombre:    "Jorge",
    apellido:  "Stalldecker",
    cargo:     "Gerente de Producto PC",
    telefono:  "+542995922007",        // formato internacional sin espacios (para tel: y wa.me)
    email:     "jorge.stalldecker@petromark.com.ar",
    web:       "https://www.petromark.com.ar",
    direccion: "Figueroa 1755, Neuquén, Argentina",
    linkedin:  ""                       // opcional, URL completa o vacío
  };
  // ==========================================================

  const $ = (s) => document.querySelector(s);
  const telVisible = persona.telefono.replace(/^\+54(\d{3})(\d{3})(\d{4})$/, "+54 $1 $2 $3");

  $('[data-campo="nombre"]').textContent = `${persona.nombre} ${persona.apellido}`;
  $('[data-campo="cargo"]').textContent = persona.cargo;
  $('[data-campo="telefonoVisible"]').textContent = telVisible;
  $('[data-campo="email"]').textContent = persona.email;
  $('[data-campo="webVisible"]').textContent = persona.web.replace(/^https?:\/\/(www\.)?/, "");
  document.title = `${persona.nombre} ${persona.apellido} — ${persona.empresa}`;

  $('#btn-tel').href  = `tel:${persona.telefono}`;
  $('#btn-wa').href   = `https://wa.me/${persona.telefono.replace(/\D/g, "")}`;
  $('#btn-mail').href = `mailto:${persona.email}`;
  $('#btn-web').href  = persona.web;

  function vCard() {
    const lineas = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      `N:${persona.apellido};${persona.nombre};;;`,
      `FN:${persona.nombre} ${persona.apellido}`,
      `ORG:${persona.empresa}`,
      `TITLE:${persona.cargo}`,
      `TEL;TYPE=CELL,VOICE:${persona.telefono}`,
      `EMAIL;TYPE=WORK:${persona.email}`,
      `URL:${persona.web}`,
      `ADR;TYPE=WORK:;;;${persona.direccion};;;`,
    ];
    if (persona.linkedin) lineas.push(`URL;TYPE=LinkedIn:${persona.linkedin}`);
    lineas.push("END:VCARD");
    return lineas.join("\r\n");
  }

  $('#btn-vcf').addEventListener('click', () => {
    const blob = new Blob([vCard()], { type: "text/vcard;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${persona.nombre}-${persona.apellido}-Petromark.vcf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  });
</script>
</body>
</html>
